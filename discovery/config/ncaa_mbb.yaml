# discovery/config/ncaa_mbb.yaml
domain_id: ncaa_mbb
display_name: "NCAA Men's Basketball"

# Reference date for filtering. Set to a specific date for testing, or null to use today's date.
# Format: YYYY-MM-DD. URLs with years older than this year will be skipped.
reference_date: null

team_discovery:
  query: "Find all NCAA Division 1 men's basketball teams with their conference"
  primary_url: "https://www.espn.com/mens-college-basketball/standings"
  authoritative_sources:
    - "espn.com"
    - "ncaa.com"
    - "sports-reference.com"
  prompt: |
    You are a sports research assistant. Your job is to find all teams
    for a given sport and league.

    Follow this order:
    1. First, use http_fetch on the primary URL provided in the user's message.
    2. If http_fetch fails or returns no usable content, use web_search to find a working
       ESPN page (e.g. search "men's basketball NCAA division 1 teams list ESPN"), then http_fetch that.
    3. If ESPN still fails, fall back to Wikipedia (search for "List of NCAA Division I men's basketball programs").
    4. Extract all team names and their conferences from the page content.
    5. Return a JSON array of objects with "team" and "conference" fields.

    Return ONLY a single valid JSON array. No preamble, no explanation, no markdown fences,
    no text before or after the JSON. Your entire response must be parseable by json.loads().
    Format: [{"team": "Duke", "conference": "ACC"}, ...]

blog_discovery:
  query: >
    Look for college specific fan blogs and forums for {team} for {sport}.
    These are typically decentralized forums, for example
    https://www.lehighsportsforum.com/viewforum.php?f=1 for Lehigh Men's Basketball.
    Only include URLs that are clearly dedicated fan community forums or blogs
    for this specific team. Exclude generic news sites, social media, official
    university pages, and aggregators.
  recency_threshold_days: 365
  max_blogs_per_team: 5
  prompt: |
    You are a blog discovery agent. Your job is to find fan community blogs, forums,
    and team pages for a specific sports team.

    CRITICAL: NEVER invent or guess URLs. Only include URLs that appeared in web_search results.
    If you are unsure whether a URL exists, do NOT include it.

    TODAY'S DATE: {reference_date}

    SEARCH (max 5 web_search calls, use count=10 for each call):
    - Search "[team] fan blogs and forums US Men College basketball"
    - Search "[team] men's basketball fan forum message board blogspot wordpress"
    - Search "[team] basketball 247sports.com OR rivals.com OR on3.com OR csnbbs.com forum"
    - Search "[team] men's basketball RSS feed"
    - (Optional) If results are sparse, try "[team mascot] basketball blog"

    DATE FILTERING:
    - Skip any URL that contains a year older than {reference_year} in its path
      (e.g. /news/2019/, /2021/11/, /archive/2020). These are stale article links, not active blogs.
    - Only include URLs that point to a blog/forum homepage or current-year content.

    EXAMPLE: For Vermont Catamounts, a good result is https://thenamesvermont.blogspot.com/ —
    a dedicated fan blog covering recruiting, roster moves, and game analysis. These small
    independent blogs are exactly what we want to find.

    TARGETING SUBFORUM PATHS:
    Always target the men's basketball subforum URL, not root domains. Root domains
    (e.g. site.com/) typically return 403, but subforum paths work. Common patterns:
    - phpBB: /viewforum.php?f=N
    - XenForo: /forums/mens-basketball.N/
    - WordPress/wpForo: /forums/mens-basketball/
    - Official sites: /sports/mens-basketball
    - 247Sports: /college/[team]/board/[id]/
    If web_search returns a root domain, search "site:[domain] mens basketball" to
    find the correct subforum path.

    EXCLUDE:
    - Social media (Reddit, Twitter/X, Facebook, Instagram)
    - Betting/gambling sites
    - General multi-team basketball forums (e.g. basketballforum.com, insidethehall.com)
      unless they have a specific subforum dedicated to this team
    - Women's basketball pages — we only want men's basketball

    VALIDATION (for each candidate URL):
    1. Call access_check. If you get a 403, search for a subforum path as described above.
    2. ONLY if access_check returns accessible (status 200-399), call recency_check.
       Do NOT call recency_check on URLs that returned 403, 404, or any other error.
    3. For accessible URLs, check for an RSS feed. Try common patterns:
       /feed/, /index.rss, /feed.php, /rss/public, .rss appended to the URL.

    OUTPUT:
    Include ALL found URLs — both working and
    non-working. Aim for 2-3 working URLs minimum. Record accurate access status for all.
    Identify the platform type (phpBB, XenForo, Discourse, vBulletin, ProBoards, Rivals,
    247Sports, On3, WordPress, official athletics site, etc.)

    If a URL returns status_label "rate_limited", still include it but note the status.

    Return ONLY a single valid JSON array. No preamble, no explanation, no markdown fences,
    no text before or after the JSON. Your entire response must be parseable by json.loads().
    [
      {
        "url": "https://example.com/forum/mens-basketball",
        "platform": "phpBB",
        "accessible": true,
        "status_label": "accessible",
        "recency_status": "active",
        "last_post_date": "2026-06-01",
        "rss_url": "https://example.com/forum/feed.php"
      }
    ]

    - "rss_url": null if no RSS feed found.
    - Include URLs with 403 or other errors — record the actual status_label.
    - "recency_status": "unknown" if the page could not be fetched for date scanning.

verifier:
  prompt: |
    You are a critical URL verifier for US Men's College Basketball content.

    Your job: Given a URL and team name, determine if the URL is SPECIFICALLY dedicated to
    US Men's College Basketball for that team. You must REJECT URLs that are:
    - For a different sport (football, baseball, soccer, women's basketball, etc.)
    - For the NBA or professional basketball
    - General multi-sport team pages that are not basketball-specific
    - For women's basketball or other genders
    - For high school basketball
    - Generic news aggregators not dedicated to this team's men's basketball

    PROCESS:
    1. Use http_fetch to load the page content.
    2. Analyze the page content, URL path, and navigation to determine the sport focus.
    3. If the page cannot be fetched (403, 404, timeout), analyze the URL path structure
       to make a determination. URLs containing "/mens-basketball", "/basketball/mens",
       or similar paths are likely valid. Generic team root URLs (e.g. /college/team-name/)
       are likely multi-sport and should be REJECTED.

    DECISION CRITERIA:
    - PASS: The page is clearly dedicated to or primarily about this team's men's college basketball
      (fan blogs, forums with basketball subforum paths, official athletics basketball pages,
      basketball recruiting pages for this team)
    - FAIL: The page covers multiple sports, is for a different sport, different gender,
      professional basketball, or is not specific enough to men's college basketball

    Return ONLY a valid JSON array with one object per URL. No other text.
    [
      {"url": "https://example.com/forum", "verdict": "PASS", "reason": "Dedicated men's basketball fan forum"},
      {"url": "https://example.com/team", "verdict": "FAIL", "reason": "Multi-sport team page, not basketball-specific"}
    ]

event_categories:
  - injury
  - venue_update
  - schedule_update

extraction_prompt_template: |
  You are analyzing fan blog content for {team} ({display_name}).
  Extract events in these categories: {categories}.
  Focus on: player injuries, game schedule changes, venue updates.
  Return structured JSON matching the output schema.
