# discovery/config/ncaa_mbb.yaml
domain_id: ncaa_mbb
display_name: "NCAA Men's Basketball"

# Reference date for filtering. Set to a specific date for testing, or null to use today's date.
# Format: YYYY-MM-DD. URLs with years older than this year will be skipped.
reference_date: null

team_discovery:
  query: "Find all NCAA Division 1 men's basketball teams with their conference"
  primary_url: "https://www.espn.com/mens-college-basketball/standings"
  authoritative_sources:
    - "espn.com"
    - "ncaa.com"
    - "sports-reference.com"
  prompt: |
    You are a sports research assistant. Your job is to find all teams
    for a given sport and league.

    Follow this order:
    1. First, use http_fetch on the primary URL provided in the user's message.
    2. If http_fetch fails or returns no usable content, use web_search to find a working
       ESPN page (e.g. search "men's basketball NCAA division 1 teams list ESPN"), then http_fetch that.
    3. Extract all team names and their conferences from the page content.
    4. Return a JSON array of objects with "team" and "conference" fields.

    IMPORTANT — TEAM NAME FORMAT:
    Always use the FULL team name including the mascot/nickname.
    - ✅ "Arizona Wildcats" (not "Arizona")
    - ✅ "Arizona State Sun Devils" (not "Arizona State")
    - ✅ "Michigan Wolverines" (not "Michigan")
    - ✅ "Michigan State Spartans" (not "Michigan State")
    - ✅ "Central Connecticut Blue Devils" (not "Central Connecticut" or "CCSU")
    Many teams share prefixes (Arizona/Arizona State, Michigan/Michigan State,
    North Carolina/North Carolina State). The mascot makes the name unambiguous.

    Return ONLY a single valid JSON array. No preamble, no explanation, no markdown fences,
    no text before or after the JSON. Your entire response must be parseable by json.loads().
    Format: [{"team": "Duke Blue Devils", "conference": "ACC"}, ...]

blog_discovery:
  query: "Find fan blogs, forums, and team news pages for {team} ({sport})."
  recency_threshold_days: 365
  max_blogs_per_team: 10
  prompt: |
    You are a blog discovery agent. Find fan community blogs, forums, and team news
    pages for a specific sports team.

    CRITICAL: NEVER invent or guess URLs. Only include URLs that appeared in web_search results.

    TODAY'S DATE: {reference_date}

    SEARCH (max 5 web_search calls, use count=10 for each):
    - "[team] men's basketball fan forum blog message board"
    - "[team] basketball 247sports OR rivals OR on3 OR csnbbs OR tapatalk OR proboards OR freeforums OR boardhost"
    - "[team abbreviation/short name] basketball forum OR fans" (e.g. "CCSU basketball forum", "UNI fans basketball")
    - "[team] men's basketball wordpress OR substack OR blogspot OR RSS"
    - (Optional) Use the 5th to find subforum paths or verify a specific site

    DATE FILTERING:
    Skip URLs with years older than {reference_year} in the path (e.g. /news/2019/).
    Only include blog/forum homepages or current-year content.

    EXAMPLES OF VALUABLE FINDS (small independent forums we prioritize):
    - https://ccsufans.com/viewforum.php?f=1 — phpBB forum (Central Connecticut State Blue Devils)
    - https://www.maroon-nation.com/forum/viewforum.php?f=5 — phpBB forum (Eastern Kentucky Colonel)
    - https://crossports.freeforums.net/board/4/mens-basketball — freeforums.net (Holy Cross)
    - https://forums.ninernation.net/c/49ers-basketball-forum/5 — Discourse forum (Charlotte 49ers)
    - https://beardownu.com/ — (Arizona Wildcats)
    - https://www.tapatalk.com/groups/colgatesports/basketball-f4/ — Tapatalk (Colgate)
    - https://thenamesvermont.blogspot.com/ — Blogspot fan blog (Vermont)

    SUBFORUM PATHS (target these instead of root domains which often return 403):
    - phpBB: /viewforum.php?f=N
    - XenForo: /forums/mens-basketball.N/
    - Invision: /index.php?/forum/N-mens-basketball/
    - Tapatalk: /groups/[name]/basketball-fN/
    - Official sites: /sports/mens-basketball/
    - BoardHost/ProBoards: root is usually fine
    If search returns a root domain, search "site:[domain] mens basketball" to find the subforum.

    EXCLUDE:
    - Social media (Reddit, Twitter/X, Facebook, Instagram)
    - Wikipedia
    - Betting/gambling sites
    - Pure score/stats pages with no written content (ESPN box scores, Yahoo Sports scores)
    - Women's basketball pages that do not have any Men's college basketball information

    DO NOT EXCLUDE:
    - Student newspapers covering men's basketball
    - Multi-sport forums that include basketball discussion
    - General basketball forums with a team-specific thread or subforum

    VALIDATION (for each candidate URL):
    1. Call access_check. If 403, try finding a subforum path.
    2. Only call recency_check on accessible URLs (status 200-399).
    3. For accessible URLs, check for RSS: try /feed/, /index.rss, /rss, /rss?path=mbball.

    OUTPUT FORMAT:
    Return ONLY a valid JSON array. No preamble, no markdown fences.
    Include ALL found URLs (working and non-working). Aim for 2-3 working minimum.
    [
      {
        "url": "https://example.com/forum/mens-basketball",
        "platform": "phpBB",
        "accessible": true,
        "status_label": "accessible",
        "recency_status": "active",
        "last_post_date": "2026-06-01",
        "rss_url": "https://example.com/forum/feed.php"
      }
    ]
    - "rss_url": null if no RSS feed found.
    - Include 403/404 URLs with their actual status_label.
    - "recency_status": "unknown" if the page could not be fetched.

verifier:
  prompt: |
    You are a URL verifier for US Men's College Basketball content.

    Given a URL and team name, determine if the page covers men's college basketball
    for that team. Multi-sport sources are fine as long as men's basketball is included.

    PROCESS:
    1. Use http_fetch to load the page.
    2. If fetch fails (403/404/timeout), judge from the URL path and domain name.

    PASS if: the page includes men's college basketball content for this team
    (dedicated basketball pages, multi-sport sites with basketball coverage,
    student newspapers, official athletics, fan forums with basketball discussion).

    FAIL if: NO men's basketball content at all (football-only, women's basketball only,
    NBA/professional only, high school only, or completely unrelated to this team).

    Return ONLY a valid JSON array:
    [
      {"url": "...", "verdict": "PASS", "reason": "..."},
      {"url": "...", "verdict": "FAIL", "reason": "..."}
    ]

event_categories:
  - injury
  - venue_update
  - schedule_update

extraction_prompt_template: |
  You are analyzing fan blog content for {team} ({display_name}).
  Extract events in these categories: {categories}.
  Focus on: player injuries, game schedule changes, venue updates.
  Return structured JSON matching the output schema.
